    <!-- selo com monograma S (original) -->
    <path id="ring" d="M-87 0 A87 87 0 1 1 87 0 A87 87 0 1 1 -87 0"/>
    <symbol id="seal" viewBox="-112 -112 224 224" overflow="visible">
