      <path d="M0 54 C-30 30 -64 6 -64 -26 C-64 -51 -45 -66 -26 -66 C-14 -66 -4 -58 0 -47 C4 -58 14 -66 26 -66 C45 -66 64 -51 64 -26 C64 6 30 30 0 54 Z"
