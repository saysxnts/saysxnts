<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="190" viewBox="0 0 1200 190" fill="none">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#d4d4d4"/>
      <stop offset=".46" stop-color="#5a5a5a"/>
      <stop offset=".5" stop-color="#141414"/>
      <stop offset=".53" stop-color="#7d7d7d"/>
      <stop offset=".72" stop-color="#ececec"/>
      <stop offset=".88" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#d4d4d4"/>
      <stop offset=".46" stop-color="#5a5a5a"/>
      <stop offset=".5" stop-color="#141414"/>
      <stop offset=".53" stop-color="#7d7d7d"/>
      <stop offset=".72" stop-color="#ececec"/>
      <stop offset=".88" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="armg" x1="0" y1="-54" x2="0" y2="0" gradientUnits="userSpaceOnUse">
