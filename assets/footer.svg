      <path d="M-74 0 L-99 0 M74 0 L99 0" stroke="#fff" stroke-opacity=".35"/>
      <path transform="translate(-49.8 46.3)" d="M89.07421875 -86.8828125Q90.556640625 -88.6875 92.0712890625 -87.4951171875Q93.5859375 -86.302734375 91.845703125 -84.626953125Q86.947265625 -79.986328125 83.6923828125 -76.9892578125Q80.4375 -73.9921875 77.666015625 -72.4453125Q72.638671875 -69.544921875 67.8369140625 -70.7373046875Q63.03515625 -71.9296875 54.26953125 -76.376953125Q45.1171875 -81.017578125 37.640625 -81.3720703125Q30.1640625 -81.7265625 23.654296875 -75.474609375Q17.2734375 -69.3515625 15.3720703125 -63.1962890625Q13.470703125 -57.041015625 13.6640625 -50.466796875Q14.115234375 -34.998046875 27.4248046875 -24.5888671875Q40.734375 -14.1796875 60.328125 -14.6953125Q74.056640625 -14.953125 83.982421875 -20.8828125Q93.908203125 -26.8125 92.296875 -38.607421875Q90.943359375 -47.953125 82.62890625 -48.5654296875Q74.314453125 -49.177734375 64.1953125 -42.732421875Q50.91796875 -34.2890625 44.923828125 -35.255859375Q38.9296875 -36.22265625 28.294921875 -50.853515625Q27.005859375 -52.529296875 28.23046875 -53.23828125Q29.455078125 -53.947265625 30.615234375 -52.20703125Q34.482421875 -46.470703125 40.5732421875 -48.7587890625Q46.6640625 -51.046875 54.01171875 -55.30078125Q58.974609375 -58.072265625 63.357421875 -60.3603515625Q67.740234375 -62.6484375 74.5078125 -61.037109375Q80.953125 -59.42578125 87.1083984375 -54.140625Q93.263671875 -48.85546875 95.197265625 -40.734375Q96.80859375 -33.64453125 94.939453125 -27.84375Q93.0703125 -22.04296875 89.9765625 -17.40234375Q84.240234375 -8.701171875 74.5400390625 -3.609375Q64.83984375 1.482421875 52.400390625 1.482421875Q34.03125 1.482421875 18.626953125 -10.828125Q3.22265625 -23.138671875 3.609375 -44.859375Q4.125 -75.603515625 49.62890625 -93.779296875Q51.8203125 -94.681640625 54.205078125 -93.521484375Q74.185546875 -83.66015625 80.5341796875 -83.853515625Q86.8828125 -84.046875 89.07421875 -86.8828125Z" fill="url(#chrome)" stroke="#fff" stroke-opacity=".4" filter="url(#lift)"/>
    </symbol>

    <path id="spark" d="M0 -14 L2.2 -2.2 L14 0 L2.2 2.2 L0 14 L-2.2 2.2 L-14 0 L-2.2 -2.2Z" fill="#fff"/>
    <path id="curl" d="M0 64 V16 Q0 0 16 0 H64 M0 26 Q14 26 14 12 Q14 6 8 6 Q4 6 4 10" stroke="#d4d4d4" stroke-opacity=".7" stroke-width="1.4" fill="none"/>
  </defs>
  <style>
    .sweep { animation: sweep 5.5s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 55%, 100% { transform: translateX(var(--d, 1400px)); } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3.6s ease-in-out infinite; opacity: 0; }
    @keyframes spark { 0%, 70%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 80% { opacity: 1; transform: scale(1) rotate(45deg); } 90% { opacity: 0; transform: scale(.3) rotate(90deg); } }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-7px); } }
    .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <g transform="translate(1200 0) scale(-1 1)"><use href="#dagger" xlink:href="#dagger" x="656.0" y="40.6" width="330.0" height="58.9" /></g>
  <use href="#dagger" xlink:href="#dagger" x="656.0" y="40.6" width="330.0" height="58.9" />
  <g class="float">
    <use href="#heart" xlink:href="#heart" x="552.0" y="22.0" width="96.0" height="90.0" />
    <use class="spark" href="#spark" xlink:href="#spark" x="632" y="34" style="animation-delay:1s"/>
  </g>
  <text x="600" y="160" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="12" letter-spacing="8" fill="#5c5c5c">FOREVER † CODE † SAYSXNTS</text>
</svg>
