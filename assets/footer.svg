      <path d="M12 -4.5 L18 4.5 M18 -4.5 L24 4.5 M24 -4.5 L30 4.5 M30 -4.5 L36 4.5" stroke="#bdbdbd" stroke-opacity=".7"/>
      <path d="M40 -5 L40 -17 C40 -25 46 -27 49 -22 C45 -21 45 -16 47 -12 L47 12 C45 16 45 21 49 22 C46 27 40 25 40 17 L40 5 Z" fill="url(#chrome)" stroke="#fff" stroke-opacity=".6"/>
