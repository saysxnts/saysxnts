      <path d="M50 -7 L250 -3.2 L302 0 L250 3.2 L50 7 Z" fill="url(#chrome)" stroke="#fff" stroke-opacity=".55"/>
      <path d="M58 0 H244" stroke="#000" stroke-opacity=".6" stroke-width="1.6"/>
      <path d="M58 -1.6 H240" stroke="#fff" stroke-opacity=".5" stroke-width=".8"/>
