      <text font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="12.5" letter-spacing="4.2" fill="#d4d4d4" dy="4.5">
        <textPath href="#ring" xlink:href="#ring">SAYSXNTS † SOFTWARE ENGINEER † SÃO PAULO †</textPath>
